databases:
  - name: proctorbuddy-db
    plan: free

services:
  - type: web
    name: proctorbuddy-backend
    plan: free  # <-- This tells Render not to use a paid instance
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: proctorbuddy-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://proctorbuddy-frontend.onrender.com
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: proctorbud76@gmail.com
      - key: DEFAULT_FROM_EMAIL
        value: ProctorBuddy <proctorbud76@gmail.com>
      - key: EMAIL_HOST_PASSWORD
        value: gnmmqtvnsiavpjkx

  - type: web
    name: proctorbuddy-frontend
    # Static sites are inherently free on Render, so no plan flag is needed here
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://proctorbuddy-backend.onrender.com