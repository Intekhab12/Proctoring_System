services:
  # ==========================================
  # 1. Django Backend Web Service
  # ==========================================
  - type: web
    name: proctorbuddy-backend
    runtime: python
    buildCommand: "./backend/build.sh"
    startCommand: "cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: proctorbuddy-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://proctorbuddy-frontend.onrender.com

  # ==========================================
  # 2. React (Vite) Frontend Static Site
  # ==========================================
  - type: static
    name: proctorbuddy-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        value: https://proctorbuddy-backend.onrender.com

# ==========================================
# 3. Managed PostgreSQL Database
# ==========================================
databases:
  - name: proctorbuddy-db
    databaseName: proctorbuddy
    user: proctorbuddy_user
    plan: free
